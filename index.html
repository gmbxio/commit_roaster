<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Roaster</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Commit Roaster</h1>
  <p>Enter a GitHub username, pick a repo, get your commit messages roasted.</p>
  <input id="user" placeholder="GitHub username" autocomplete="off">
  <button id="go">Find repos</button>
  <div id="repos"></div>
  <div id="out"></div>
</main>
<script src="app.js"></script>
</body>
</html>
